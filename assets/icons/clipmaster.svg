<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="clip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- App tile background -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="58" fill="url(#sheen)"/>

  <!-- Back sheet (history depth) -->
  <rect x="86" y="72" width="100" height="132" rx="14" fill="#FFFFFF" opacity="0.28"/>

  <!-- Front clipboard body -->
  <rect x="68" y="58" width="112" height="144" rx="16" fill="#FFFFFF"/>

  <!-- Clip tab -->
  <rect x="100" y="42" width="48" height="28" rx="9" fill="url(#clip)"/>
  <rect x="108" y="50" width="32" height="10" rx="5" fill="#FFFFFF" opacity="0.55"/>

  <!-- History lines -->
  <rect x="86" y="96" width="76" height="10" rx="5" fill="#5B21B6" opacity="0.85"/>
  <rect x="86" y="120" width="76" height="10" rx="5" fill="#A78BFA"/>
  <rect x="86" y="144" width="52" height="10" rx="5" fill="#A78BFA" opacity="0.6"/>

  <!-- Success badge -->
  <circle cx="176" cy="176" r="28" fill="#22D3AE" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M164 176 l8 8 l18 -18" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
